services:
  - type: web
    name: ai-reception
    runtime: ruby
    plan: free
    buildCommand: bundle install && SECRET_KEY_BASE_DUMMY=1 bin/rails assets:precompile
    startCommand: bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-reception-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

databases:
  - name: ai-reception-db
    plan: free
    databaseName: ai_reception_production
